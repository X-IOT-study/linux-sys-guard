name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in bin/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Unit tests (no root required)
        run: |
          for t in tests/test-*.sh; do
            echo "=== $t ==="
            bash "$t" || exit 1
          done

      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bin/*.sh tests/*.sh || true
